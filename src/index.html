<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>OpDesk — Operator's Command Centre for Safari, Shuttle & Charter Businesses</title>
    <meta name="description" content="OpDesk is the all-in-one operations platform for safari operators, shuttle companies, fishing charters, and travel businesses. Manage bookings, guides, vehicles, certificates, and invoices. Multi-currency, 12 languages. No per-booking fees." />
    <meta name="keywords" content="safari operator software, travel operator management, safari booking system, charter management software, shuttle management, guide certificate tracking, FGASA tracking, travel business software, South Africa safari software, game lodge management" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="OpDesk" />
    <link rel="canonical" href="https://opdesk.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://opdesk.app/" />
    <meta property="og:title" content="OpDesk — Operator's Command Centre" />
    <meta property="og:description" content="Bookings, guides, vehicles, certificates, and invoices — all in one platform built for safari and travel operators. Multi-currency. No per-booking fees." />
    <meta property="og:image" content="https://opdesk.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="OpDesk" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://opdesk.app/" />
    <meta name="twitter:title" content="OpDesk — Operator's Command Centre" />
    <meta name="twitter:description" content="All-in-one operations for safari operators, charters & shuttles. Bookings, guides, certs, invoices. Multi-currency." />
    <meta name="twitter:image" content="https://opdesk.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#D4A853" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpDesk",
      "url": "https://opdesk.app",
      "description": "All-in-one operations management platform for safari operators, shuttle companies, fishing charters, yacht charters, and adventure tour operators.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "ZAR",
        "description": "Free tier available. Paid plans from R349/month."
      },
      "featureList": [
        "Booking management",
        "Guide certificate tracking (FGASA, First Aid, PDP)",
        "Vehicle fleet management",
        "Driver management",
        "Pro forma invoice generation",
        "Firearm register",
        "Multi-currency support",
        "12 language support",
        "Calendar scheduling",
        "2FA security"
      ]
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpDesk",
      "url": "https://opdesk.app",
      "logo": "https://opdesk.app/favicon.svg",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
